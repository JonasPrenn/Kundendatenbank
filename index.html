<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundendatenbank</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--border:#dde1e6;--text:#1f2430;--muted:#6b7280;--accent:#2563eb;--danger:#dc2626;--dupe:#fff7e0;}
  *{box-sizing:border-box}
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px;}
  h1{font-size:1.4rem;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:20px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  label{font-size:.78rem;color:var(--muted);display:block;margin-bottom:3px}
  input{width:100%;padding:7px 8px;border:1px solid var(--border);border-radius:6px;font-size:.9rem}
  button{cursor:pointer;border:none;border-radius:6px;padding:8px 16px;font-size:.85rem;font-weight:600}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-secondary{background:#e5e7eb;color:#1f2430}
  .btn-danger{background:var(--danger);color:#fff;padding:4px 10px;font-size:.75rem}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .toolbar input,.toolbar select{padding:7px 8px;border:1px solid var(--border);border-radius:6px;font-size:.85rem}
  .toolbar label{display:flex;align-items:center;gap:5px;font-size:.85rem;color:var(--text);margin:0}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
  tr.dupe{background:var(--dupe)}
  .badge{background:#f59e0b;color:#fff;font-size:.68rem;padding:2px 6px;border-radius:10px;margin-left:6px}
  .empty{color:var(--muted);padding:20px;text-align:center}
  .count{color:var(--muted);font-size:.8rem;margin-left:auto}

  .overlay{position:fixed;inset:0;background:rgba(15,18,26,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border-radius:12px;padding:22px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal h2{margin:0 0 14px;font-size:1.1rem}
  .section-title{grid-column:1/-1;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin:10px 0 -2px}
  .modal form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .full{grid-column:1/-1}
  .modal .actions{grid-column:1/-1;display:flex;gap:8px;margin-top:6px;justify-content:flex-end}
</style>
</head>
<body>
<h1>Kundendatenbank</h1>

<div class="card">
  <div class="top-actions">
    <div class="toolbar" style="margin-bottom:0">
      <input id="search" placeholder="Suche (alle Felder)…" style="min-width:220px">
      <select id="filter-ort"><option value="">Alle Orte</option></select>
      <select id="filter-hv"><option value="">Alle Hausverwaltungen</option></select>
      <label><input type="checkbox" id="filter-dupe"> Nur mögliche Duplikate</label>
      <span class="count" id="count"></span>
    </div>
    <button class="btn-primary" id="new-btn">+ Neuer Kunde</button>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th data-k="nr">Kd.-Nr.</th><th data-k="obj">Objekt</th><th data-k="oStr">Objektadresse</th>
          <th data-k="oOrt">Ort</th><th data-k="hv">Hausverwaltung</th><th data-k="hvMail">Rechnungsmail</th>
          <th data-k="von">Gültig von</th><th data-k="bis">Gültig bis</th><th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">Keine Kunden gefunden.</div>
  </div>
</div>

<div class="overlay" id="modal-overlay" style="display:none">
  <div class="modal">
    <h2 id="modal-title">Neuer Kunde</h2>
    <form id="form">
      <div class="section-title">Kunde / Objekt</div>
      <div><label>Kundennummer</label><input id="f-nr" required></div>
      <div class="full"><label>Objektbezeichnung</label><input id="f-obj" required></div>
      <div class="full"><label>Objektadresse – Straße / Hausnummer</label><input id="f-oStr" required></div>
      <div><label>PLZ</label><input id="f-oPlz" required></div>
      <div style="grid-column:span 2"><label>Ort</label><input id="f-oOrt" required></div>

      <div class="section-title">Hausverwaltung</div>
      <div class="full"><label>Hausverwaltung</label><input id="f-hv" list="hv-list" required></div>
      <datalist id="hv-list"></datalist>
      <div class="full"><label>Adresse Hausverwaltung – Straße / Hausnummer</label><input id="f-hvStr"></div>
      <div><label>PLZ</label><input id="f-hvPlz"></div>
      <div><label>Ort</label><input id="f-hvOrt"></div>
      <div><label>Rechnungsmail</label><input id="f-hvMail" type="email"></div>

      <div class="section-title">Gültigkeit</div>
      <div><label>Gültig von</label><input id="f-von" type="date"></div>
      <div><label>Gültig bis</label><input id="f-bis" type="date"></div>

      <div class="actions">
        <button type="button" class="btn-secondary" id="cancel-btn">Abbrechen</button>
        <button type="submit" class="btn-primary" id="submit-btn">Speichern</button>
      </div>
    </form>
  </div>
</div>

<script>
const LS_KEY = 'kundendatenbank';
let customers = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
if(customers === null){ customers = seedData(); localStorage.setItem(LS_KEY, JSON.stringify(customers)); }

let editingId = null;
let sortKey = 'nr', sortAsc = true;

const $ = id => document.getElementById(id);
const fields = ['nr','obj','oStr','oPlz','oOrt','hv','hvStr','hvPlz','hvOrt','hvMail','von','bis'];
const fEls = Object.fromEntries(fields.map(k => [k, $('f-'+k)]));

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(customers)); }

// --- Levenshtein distance for fuzzy duplicate detection ---
function levenshtein(a, b){
  a = (a||'').toLowerCase().trim(); b = (b||'').toLowerCase().trim();
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  const d = Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    d[i][j] = a[i-1]===b[j-1] ? d[i-1][j-1] : 1+Math.min(d[i-1][j],d[i][j-1],d[i-1][j-1]);
  }
  return d[m][n];
}
// Duplicate check uses ONLY the Objektadresse + Objektbezeichnung – the Hausverwaltungsadresse is irrelevant here.
function normObjAddr(c){ return (c.oStr+' '+c.oPlz+' '+c.oOrt).toLowerCase().replace(/\s+/g,' ').trim(); }

function computeDupes(){
  const dupeIds = new Set();
  for(let i=0;i<customers.length;i++){
    for(let j=i+1;j<customers.length;j++){
      const a=customers[i], b=customers[j];
      if(a.id===b.id) continue;
      const sameAddr = normObjAddr(a)===normObjAddr(b) || levenshtein(normObjAddr(a),normObjAddr(b))<=2;
      const closeObj = levenshtein(a.obj,b.obj)<=2;
      if(sameAddr && (closeObj || (a.oPlz===b.oPlz && a.oStr.toLowerCase()===b.oStr.toLowerCase()))){
        dupeIds.add(a.id); dupeIds.add(b.id);
      }
    }
  }
  return dupeIds;
}

function refreshDatalists(){
  const hvList = $('hv-list'); hvList.innerHTML='';
  const hvs = [...new Set(customers.map(c=>c.hv).filter(Boolean))];
  hvs.forEach(h=>{ const o=document.createElement('option'); o.value=h; hvList.appendChild(o); });

  const fo = $('filter-ort'), fh = $('filter-hv');
  const curOrt = fo.value, curHv = fh.value;
  fo.innerHTML='<option value="">Alle Orte</option>' + [...new Set(customers.map(c=>c.oOrt).filter(Boolean))].sort()
    .map(o=>`<option ${o===curOrt?'selected':''}>${o}</option>`).join('');
  fh.innerHTML='<option value="">Alle Hausverwaltungen</option>' + hvs.sort()
    .map(h=>`<option ${h===curHv?'selected':''}>${h}</option>`).join('');
}

// Autofill Hausverwaltungsdaten (Adresse + Rechnungsmail) wenn diese HV bereits bei einem anderen Kunden erfasst ist.
// Greift nur solange die Felder noch leer sind, damit man sie danach frei überschreiben kann.
fEls.hv.addEventListener('input', () => {
  const val = fEls.hv.value.trim().toLowerCase();
  if(!val) return;
  const match = customers.find(c => c.hv.trim().toLowerCase() === val);
  if(!match) return;
  if(!fEls.hvStr.value) fEls.hvStr.value = match.hvStr;
  if(!fEls.hvPlz.value) fEls.hvPlz.value = match.hvPlz;
  if(!fEls.hvOrt.value) fEls.hvOrt.value = match.hvOrt;
  if(!fEls.hvMail.value) fEls.hvMail.value = match.hvMail;
});

$('new-btn').addEventListener('click', () => openModal());
$('cancel-btn').addEventListener('click', closeModal);
$('modal-overlay').addEventListener('click', e => { if(e.target.id==='modal-overlay') closeModal(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

function openModal(customer){
  editingId = customer ? customer.id : null;
  $('form').reset();
  fields.forEach(k => fEls[k].value = customer ? (customer[k]||'') : '');
  $('modal-title').textContent = customer ? 'Kunde bearbeiten' : 'Neuer Kunde';
  $('modal-overlay').style.display = 'flex';
  fEls.nr.focus();
}
function closeModal(){
  $('modal-overlay').style.display = 'none';
  editingId = null;
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const data = { id: editingId || crypto.randomUUID() };
  fields.forEach(k => data[k] = fEls[k].value.trim());
  if(editingId){
    customers = customers.map(c => c.id===editingId ? data : c);
  } else {
    customers.push(data);
  }
  save();
  closeModal();
  render();
});

function editCustomer(id){
  const c = customers.find(x=>x.id===id);
  if(c) openModal(c);
}

function deleteCustomer(id){
  if(!confirm('Diesen Kunden wirklich löschen?')) return;
  customers = customers.filter(c=>c.id!==id);
  save();
  render();
}

document.querySelectorAll('th[data-k]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.k;
    if(sortKey===k) sortAsc=!sortAsc; else { sortKey=k; sortAsc=true; }
    render();
  });
});

['search','filter-ort','filter-hv','filter-dupe'].forEach(id => $(id).addEventListener('input', render));

function render(){
  refreshDatalists();
  const dupeIds = computeDupes();
  const q = $('search').value.toLowerCase().trim();
  const fOrt = $('filter-ort').value;
  const fHv = $('filter-hv').value;
  const onlyDupes = $('filter-dupe').checked;

  let list = customers.filter(c => {
    if(fOrt && c.oOrt!==fOrt) return false;
    if(fHv && c.hv!==fHv) return false;
    if(onlyDupes && !dupeIds.has(c.id)) return false;
    if(q){
      const hay = fields.map(k=>c[k]||'').join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a,b) => {
    const av=(a[sortKey]||'').toString(), bv=(b[sortKey]||'').toString();
    return sortAsc ? av.localeCompare(bv,'de',{numeric:true}) : bv.localeCompare(av,'de',{numeric:true});
  });

  const tbody = $('rows');
  tbody.innerHTML = list.map(c => `
    <tr class="${dupeIds.has(c.id)?'dupe':''}">
      <td>${esc(c.nr)}</td>
      <td>${esc(c.obj)} ${dupeIds.has(c.id)?'<span class="badge">Duplikat?</span>':''}</td>
      <td>${esc(c.oStr)}, ${esc(c.oPlz)}</td>
      <td>${esc(c.oOrt)}</td>
      <td>${esc(c.hv)}</td>
      <td>${esc(c.hvMail)}</td>
      <td>${esc(c.von)}</td>
      <td>${esc(c.bis)}</td>
      <td>
        <button class="btn-secondary" style="padding:4px 10px;font-size:.75rem" onclick="editCustomer('${c.id}')">Bearbeiten</button>
        <button class="btn-danger" onclick="deleteCustomer('${c.id}')">Löschen</button>
      </td>
    </tr>`).join('');

  $('empty').style.display = list.length ? 'none' : 'block';
  $('count').textContent = `${list.length} von ${customers.length} Kunden`;
}

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Beispieldaten (Vorarlberg) inkl. zweier Duplikatspaare zum Testen der Erkennung
function seedData(){
  const mk = (nr,obj,oStr,oPlz,oOrt,hv,hvStr,hvPlz,hvOrt,hvMail,von,bis) =>
    ({id:crypto.randomUUID(),nr,obj,oStr,oPlz,oOrt,hv,hvStr,hvPlz,hvOrt,hvMail,von,bis});
  return [
    mk('1001','Wohnanlage Seeblick','Seestraße 12','6900','Bregenz','Alpin Hausverwaltung GmbH','Rathausstraße 5','6900','Bregenz','buchhaltung@alpin-hv.at','2023-01-01','2025-12-31'),
    mk('1002','Haus Rheintal','Poststraße 3','6850','Dornbirn','Rheintal Immobilien Service','Marktplatz 1','6850','Dornbirn','rechnung@rheintal-immo.at','2023-03-01','2026-02-28'),
    mk('1003','Wohnpark Montfort','Schlossgraben 8','6800','Feldkirch','Montfort Hausverwaltung KG','Neustadt 22','6800','Feldkirch','office@montfort-hv.at','2022-06-01','2025-05-31'),
    mk('1004','Residenz Bludenz','Werdenbergerstraße 15','6700','Bludenz','Alpin Hausverwaltung GmbH','Rathausstraße 5','6900','Bregenz','buchhaltung@alpin-hv.at','2024-01-01','2026-12-31'),
    mk('1005','Wohnanlage Seeblik','Seestraße 12','6900','Bregenz','Alpin Hausverwaltung GmbH','Rathausstraße 5','6900','Bregenz','buchhaltung@alpin-hv.at','2023-01-01','2025-12-31'),
    mk('1006','Gewerbepark Lustenau','Millennium Park 2','6890','Lustenau','Rheintal Immobilien Service','Marktplatz 1','6850','Dornbirn','rechnung@rheintal-immo.at','2023-09-01','2025-08-31'),
    mk('1007','Haus am Ried','Riedgasse 9','6845','Hohenems','Hohenems Wohnbau Verwaltung','Schweizer Straße 4','6845','Hohenems','verwaltung@hohenems-wohnbau.at','2022-01-01','2024-12-31'),
    mk('1008','Haus am Reid','Riedgasse 9','6845','Hohenems','Hohenems Wohnbau Verwaltung','Schweizer Straße 4','6845','Hohenems','verwaltung@hohenems-wohnbau.at','2022-01-01','2024-12-31'),
    mk('1009','Wohnhaus Götzis Nord','Hauptstraße 44','6840','Götzis','Montfort Hausverwaltung KG','Neustadt 22','6800','Feldkirch','office@montfort-hv.at','2024-04-01','2027-03-31'),
    mk('1010','Sonnenhof Rankweil','Bahnhofstraße 7','6830','Rankweil','Rankweil Immobilienverwaltung','Ringstraße 12','6830','Rankweil','info@rankweil-immoverwaltung.at','2023-07-01','2026-06-30'),
    mk('1011','Panoramahaus Bregenz','Achstraße 21','6900','Bregenz','Alpin Hausverwaltung GmbH','Rathausstraße 5','6900','Bregenz','buchhaltung@alpin-hv.at','2024-02-01','2027-01-31'),
    mk('1012','Wohnanlage Kirchdorf','Kirchstraße 18','6800','Feldkirch','Montfort Hausverwaltung KG','Neustadt 22','6800','Feldkirch','office@montfort-hv.at','2023-05-01','2026-04-30'),
  ];
}

render();
</script>
</body>
</html>
